<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registre de la colonie · Iristhale</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg stroke='%23D4B06A' stroke-width='7' stroke-linecap='round' fill='none'%3E%3Cpath d='M12 64H88'/%3E%3Cpath d='M30 64A20 20 0 0 1 70 64Z' fill='%23D4B06A'/%3E%3Cpath d='M50 32V20M73 41l7-7M27 41l-7-7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/commun.css">
<link rel="stylesheet" href="css/portail.css">
</head>
<body>

<!-- Entrée -->
<section id="entree" class="entree">
  <div class="entree-ciel" aria-hidden="true"></div>
  <form id="form-entree" class="entree-carte" autocomplete="off">
    <img src="assets/sceau-128.png" alt="" width="96" height="96" class="entree-sceau">
    <h1>Registre de la colonie</h1>
    <p class="entree-sous">Compagnie du Levant · Iristhale</p>
    <label class="champ">
      <span>Mot de passe du colon</span>
      <input id="mdp" type="password" required autocomplete="current-password">
    </label>
    <button class="bouton" type="submit">Ouvrir le registre</button>
    <p id="entree-erreur" class="entree-erreur" role="alert"></p>
  </form>
</section>

<!-- Portail -->
<div id="portail" hidden>
  <header class="entete">
    <div class="entete-haut">
      <a href="#village" class="marque">
        <img src="assets/sceau-128.png" alt="" width="40" height="40">
        <span>
          <strong id="nom-village">Le camp</strong>
          <small id="horloge"></small>
        </span>
      </a>
      <div class="moi">
        <span class="bourse" title="Votre bourse"><strong id="solde">0 po</strong></span>
        <a href="#fiche" id="nom-moi" class="nom-moi"></a>
        <button id="sortir" class="bouton discret petit" type="button">Sortir</button>
      </div>
    </div>
    <nav class="onglets" aria-label="Sections">
      <a href="#village">Village</a>
      <a href="#echoppe">Échoppe</a>
      <a href="#missions">Missions</a>
      <a href="#votes">Votes <span id="pastille-votes" class="pastille" hidden></span></a>
      <a href="#journal">Journal</a>
      <a href="#habitants">Habitants</a>
      <a href="#bestiaire">Bestiaire</a>
      <a href="#carnet">Carnet</a>
      <a href="#fiche">Ma fiche</a>
    </nav>
  </header>
  <main id="contenu" class="contenu" tabindex="-1"><p class="chargement">On déroule le registre…</p></main>
</div>

<dialog id="fenetre" class="fenetre parchemin"><div id="fenetre-corps"></div>
  <form method="dialog"><button class="bouton discret petit fermer" aria-label="Fermer">Fermer</button></form>
</dialog>

<script type="module" src="js/portail.js"></script>
</body>
</html>
